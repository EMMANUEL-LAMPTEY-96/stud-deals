# Weekly pull requests for outdated or vulnerable dependencies.
# Security fixes also arrive as soon as an advisory is published once
# "Dependabot security updates" is enabled in the repo's Settings → Security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
