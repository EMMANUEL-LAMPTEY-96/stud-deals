name: E2E smoke tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        required: false
        default: https://studeals.vercel.app
  schedule:
    - cron: '23 5 * * *' # daily, 05:23 UTC

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://studeals.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
